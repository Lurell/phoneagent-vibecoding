distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方地址 services.gradle.org 会 307 跳转到 github.com。在中国大陆的网络下
# github.com 常常不可达，构建会直接卡死在这里，因此默认走腾讯云镜像。
# 镜像内容与官方一致 —— distributionSha256Sum 是 Gradle 官方公布的校验和，
# 若镜像被篡改或版本不符，wrapper 会拒绝启动。
# 海外用户可改回：https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.8.0-bin.zip
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
