# ── 内存 ───────────────────────────────────────────────────────────────────
# 这台开发机只有 7GB 物理内存，Gradle 守护进程 + Kotlin 编译器守护进程 +
# AGP 的 worker 进程很容易把它吃穿，表现是 JVM 直接硬崩：
#     "Native memory allocation (mmap) failed to map ... G1 virtual space"
# 所以下面几个值是按 7GB 调的，不是随手写的。
# 内存充裕的机器可以放宽到 -Xmx3g / parallel=true，构建会快不少。
#
# file.encoding 在这台机器上不是可选项：系统区域是中文（GBK/cp936），
# Kotlin 源码里任何非 ASCII 字符都会被编译错或被写坏。
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m

# 并行与 worker 数：同时跑多个编译/dex 进程会成倍占用内存，小内存机器上反而更慢
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
